<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Одиничне коло з проекціями</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    body { margin: 0; background: #001122; font-family: sans-serif; color: white; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.9);
      padding: 15px;
      border-radius: 10px;
      z-index: 1000;
      font-size: 14px;
    }
    #values {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.9);
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      border-radius: 10px;
    }
    #emotionStatus {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.9);
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
    }
    #videoContainer {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 240px;
      height: 180px;
      border: 2px solid white;
      border-radius: 10px;
      overflow: hidden;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .sin-color { color: #3498db; }
    .cos-color { color: #e74c3c; }
    .tan-color { color: #2ecc71; }
    .happy { color: #ffeb3b; }
    .sad { color: #2196f3; }
    .neutral { color: #9e9e9e; }
    .angry { color: #f44336; }
    .emotion-btn {
      margin: 2px;
      padding: 5px 10px;
      background: #333;
      border: 1px solid #555;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      font-size: 12px;
    }
    .emotion-btn.active {
      background: #4CAF50;
    }
    #cameraToggle {
      background: #2196f3;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    #cameraToggle.active {
      background: #4CAF50;
    }
    .disabled {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <label>Кут: <span id="angleDisplay">0°</span> (<span id="radianDisplay">0.00</span> рад)</label><br />
    <input type="range" min="0" max="360" value="0" id="angleSlider" /><br />
    <label><input type="checkbox" id="showSin" checked /> <span class="sin-color">sin(θ)</span></label><br />
    <label><input type="checkbox" id="showCos" checked /> <span class="cos-color">cos(θ)</span></label><br />
    <label><input type="checkbox" id="showTan" checked /> <span class="tan-color">tan(θ)</span></label><br />
    <label><input type="checkbox" id="animate" /> Анімація</label><br />
    
    <button id="cameraToggle">📹 Тест камери</button>
    
    <div style="margin-top: 10px;">
      <div>Контроль швидкості:</div>
      <div id="manualControls">
        <button class="emotion-btn" data-emotion="happy">😊 Швидко (5x)</button>
        <button class="emotion-btn" data-emotion="sad">😢 Повільно (0.2x)</button>
        <button class="emotion-btn" data-emotion="angry">😠 Середньо (0.5x)</button>
        <button class="emotion-btn active" data-emotion="neutral">😐 Нормально (1x)</button>
      </div>
    </div>
    
    <div style="margin-top: 10px; font-size: 12px;">
      <div>🎯 Інструкція для камери:</div>
      <div>• Яскраве світло = Швидко</div>
      <div>• Темне середовище = Повільно</div>
      <div>• Руки перед камерою = Дуже повільно</div>
    </div>
  </div>

  <div id="values">
    <div class="sin-color">sin(θ) = <span id="sinVal">0.000</span></div>
    <div class="cos-color">cos(θ) = <span id="cosVal">1.000</span></div>
    <div class="tan-color">tan(θ) = <span id="tanVal">0.000</span></div>
  </div>

  <div id="emotionStatus">
    <div>Режим: <span id="currentEmotion" class="neutral">Нейтральний</span></div>
    <div>Швидкість: <span id="speedDisplay">1x</span></div>
    <div>Камера: <span id="cameraStatus">Вимкнена</span></div>
    <div id="detectionInfo" style="font-size: 12px; margin-top: 5px;">Очікування...</div>
  </div>

  <div id="videoContainer" style="display: none;">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <a-scene background="color: #001122">
    <a-entity id="cameraRig">
      <a-entity camera position="0 0 5" look-controls="enabled: true" wasd-controls="enabled: true"></a-entity>
    </a-entity>

    <a-entity id="circleGroup">
      <a-ring radius-inner="0.99" radius-outer="1.01" color="white"></a-ring>
      <a-entity line="start: -1.5 0 0; end: 1.5 0 0; color: white"></a-entity>
      <a-entity line="start: 0 -1.5 0; end: 0 1.5 0; color: white"></a-entity>

      <a-entity id="labels">
        <a-text value=" 0° " position="1.3 0 0" color="white" align="center" side="double" scale="1 1 1"></a-text>
        <a-text value=" 45° " position="0.92 0.92 0" color="white" align="center" side="double" scale="1 1 1"></a-text>
        <a-text value=" 90° " position="0 1.3 0" color="white" align="center" side="double" scale="1 1 1"></a-text>
        <a-text value=" 135° " position="-0.92 0.92 0" color="white" align="center" side="double" scale="1 1 1"></a-text>
        <a-text value=" 180° " position="-1.3 0 0" color="white" align="center" side="double" scale="1 1 1"></a-text>
        <a-text value=" 225° " position="-0.92 -0.92 0" color="white" align="center" side="double" scale="1 1 1"></a-text>
        <a-text value=" 270° " position="0 -1.3 0" color="white" align="center" side="double" scale="1 1 1"></a-text>
        <a-text value=" 315° " position="0.92 -0.92 0" color="white" align="center" side="double" scale="1 1 1"></a-text>
        <a-text value="1" position="0 1.05 0" color="red" align="center" side="double" scale="1 1 1"></a-text>
        <a-text value="-1" position="0 -1.05 0" color="red" align="center" side="double" scale="1 1 1"></a-text>
        <a-text value="1" position="1.05 0 0" color="red" align="center" side="double" scale="1 1 1"></a-text>
        <a-text value="-1" position="-1.05 0 0" color="red" align="center" side="double" scale="1 1 1"></a-text>
      </a-entity>

      <a-entity id="radiusVec" line="start: 0 0 0; end: 1 0 0; color: yellow"></a-entity>
      <a-sphere id="dot" radius="0.05" color="yellow" position="1 0 0"></a-sphere>
      <a-entity id="sinLine" line="start: 0 0 0; end: 0 0 0; color: #3498db"></a-entity>
      <a-entity id="sinHelper" line="start: 0 0 0; end: 0 0 0; color: #cccccc"></a-entity>
      <a-entity id="cosLine" line="start: 0 0 0; end: 0 0 0; color: #e74c3c"></a-entity>
      <a-entity id="cosHelper" line="start: 0 0 0; end: 0 0 0; color: #cccccc"></a-entity>
      <a-entity id="tanLine" line="start: 0 0 0; end: 0 0 0; color: #2ecc71"></a-entity>
      <a-entity id="tanHelper" line="start: 0 0 0; end: 0 0 0; color: #cccccc"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const angleSlider = document.getElementById('angleSlider');
    const angleDisplay = document.getElementById('angleDisplay');
    const radianDisplay = document.getElementById('radianDisplay');
    const animateCheck = document.getElementById('animate');
    const showSin = document.getElementById('showSin');
    const showCos = document.getElementById('showCos');
    const showTan = document.getElementById('showTan');
    const sinVal = document.getElementById('sinVal');
    const cosVal = document.getElementById('cosVal');
    const tanVal = document.getElementById('tanVal');
    const currentEmotionSpan = document.getElementById('currentEmotion');
    const speedDisplay = document.getElementById('speedDisplay');
    const cameraStatus = document.getElementById('cameraStatus');
    const detectionInfo = document.getElementById('detectionInfo');
    const emotionButtons = document.querySelectorAll('.emotion-btn');
    const cameraToggle = document.getElementById('cameraToggle');
    const videoContainer = document.getElementById('videoContainer');
    const video = document.getElementById('video');
    const manualControls = document.getElementById('manualControls');

    const dot = document.getElementById('dot');
    const radiusVec = document.getElementById('radiusVec');
    const sinLine = document.getElementById('sinLine');
    const sinHelper = document.getElementById('sinHelper');
    const cosLine = document.getElementById('cosLine');
    const cosHelper = document.getElementById('cosHelper');
    const tanLine = document.getElementById('tanLine');
    const tanHelper = document.getElementById('tanHelper');

    let angle = 0;
    let animating = false;
    let currentEmotion = 'neutral';
    let animationSpeed = 1;
    let cameraActive = false;
    let stream = null;

    // Простий тест камери
    async function startCamera() {
      try {
        detectionInfo.textContent = 'Запуск камери...';
        
        // Запит доступу до камери
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            width: 240, 
            height: 180
          } 
        });
        
        console.log('Камера успішно запущена!', stream);
        
        video.srcObject = stream;
        videoContainer.style.display = 'block';
        cameraActive = true;
        cameraStatus.textContent = 'Працює ✅';
        cameraToggle.textContent = '📹 Вимкнути камеру';
        cameraToggle.classList.add('active');
        
        detectionInfo.textContent = 'Камера працює! Змінюйте освітлення';
        
        // Заблокувати ручний контроль
        manualControls.classList.add('disabled');
        
        // Почати простий аналіз
        setTimeout(startSimpleAnalysis, 1000);
        
      } catch (error) {
        console.error('Помилка камери:', error);
        detectionInfo.textContent = 'ПОМИЛКА: ' + error.message;
        cameraStatus.textContent = 'Помилка ❌';
        
        // Показати детальну інформацію про помилку
        if (error.name === 'NotAllowedError') {
          detectionInfo.textContent = 'Доступ до камери заборонено. Дозвольте доступ.';
        } else if (error.name === 'NotFoundError') {
          detectionInfo.textContent = 'Камера не знайдена на пристрої.';
        } else {
          detectionInfo.textContent = 'Невідома помилка камери: ' + error.name;
        }
      }
    }

    function stopCamera() {
      console.log('Зупинка камери...');
      
      if (stream) {
        stream.getTracks().forEach(track => {
          track.stop();
          console.log('Зупинено трек:', track);
        });
        stream = null;
      }
      
      videoContainer.style.display = 'none';
      cameraActive = false;
      cameraStatus.textContent = 'Вимкнена';
      cameraToggle.textContent = '📹 Тест камери';
      cameraToggle.classList.remove('active');
      detectionInfo.textContent = 'Камера вимкнена';
      
      // Розблокувати ручний контроль
      manualControls.classList.remove('disabled');
    }

    // Простий аналіз яскравості
    function startSimpleAnalysis() {
      if (!cameraActive) return;
      
      try {
        // Створити canvas для аналізу
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 240;
        canvas.height = 180;
        
        // Аналіз кожні 500мс
        const analyzer = setInterval(() => {
          if (!cameraActive || !video.videoWidth) {
            clearInterval(analyzer);
            return;
          }
          
          try {
            // Намалювати поточний кадр
            ctx.drawImage(video, 0, 0, 240, 180);
            
            // Отримати дані пікселів
            const imageData = ctx.getImageData(0, 0, 240, 180);
            const pixels = imageData.data;
            
            // Обчислити середню яскравість
            let totalBrightness = 0;
            for (let i = 0; i < pixels.length; i += 4) {
              const r = pixels[i];
              const g = pixels[i + 1];
              const b = pixels[i + 2];
              totalBrightness += (r + g + b) / 3;
            }
            
            const avgBrightness = totalBrightness / (pixels.length / 4);
            
            console.log('Яскравість:', avgBrightness.toFixed(2));
            
            // Визначити "емоцію" на основі яскравості
            let detectedEmotion = 'neutral';
            if (avgBrightness > 150) {
              detectedEmotion = 'happy'; // Яскраво = швидко
            } else if (avgBrightness < 50) {
              detectedEmotion = 'sad'; // Темно = повільно  
            } else if (avgBrightness < 100) {
              detectedEmotion = 'angry'; // Середньо темно
            }
            
            updateEmotion(detectedEmotion);
            detectionInfo.textContent = `Яскравість: ${avgBrightness.toFixed(0)}`;
            
          } catch (analyzeError) {
            console.error('Помилка аналізу:', analyzeError);
          }
        }, 500);
        
      } catch (error) {
        console.error('Помилка створення аналізатора:', error);
      }
    }

    // Оновлення емоції та швидкості
    function updateEmotion(emotion) {
      if (currentEmotion === emotion) return;
      
      currentEmotion = emotion;
      
      // Оновити активну кнопку
      emotionButtons.forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.emotion === emotion) {
          btn.classList.add('active');
        }
      });
      
      // Встановлення швидкості залежно від емоції
      switch (emotion) {
        case 'happy':
          animationSpeed = 5; // Дуже швидко!
          currentEmotionSpan.textContent = 'Швидкий';
          currentEmotionSpan.className = 'happy';
          break;
        case 'sad':
          animationSpeed = 0.2; // Дуже повільно
          currentEmotionSpan.textContent = 'Повільний';
          currentEmotionSpan.className = 'sad';
          break;
        case 'angry':
          animationSpeed = 0.5; // Середній
          currentEmotionSpan.textContent = 'Середній';
          currentEmotionSpan.className = 'angry';
          break;
        default:
          animationSpeed = 1; // Нормально
          currentEmotionSpan.textContent = 'Нормальний';
          currentEmotionSpan.className = 'neutral';
      }
      
      speedDisplay.textContent = animationSpeed + 'x';
    }

    function updateScene() {
      const rad = angle * Math.PI / 180;
      const sin = Math.sin(rad);
      const cos = Math.cos(rad);
      const tan = Math.tan(rad);

      angleDisplay.textContent = angle;
      radianDisplay.textContent = rad.toFixed(2);
      sinVal.textContent = sin.toFixed(3);
      cosVal.textContent = cos.toFixed(3);
      tanVal.textContent = Math.abs(cos) < 0.01 ? '∞' : tan.toFixed(3);

      dot.setAttribute('position', `${cos} ${sin} 0`);
      radiusVec.setAttribute('line', `start: 0 0 0; end: ${cos} ${sin} 0`);

      if (showSin.checked) {
        sinLine.setAttribute('line', `start: 0 0 0; end: 0 ${sin} 0`);
        sinHelper.setAttribute('line', `start: ${cos} ${sin} 0; end: 0 ${sin} 0`);
      } else {
        sinLine.setAttribute('line', `start: 0 0 0; end: 0 0 0`);
        sinHelper.setAttribute('line', `start: 0 0 0; end: 0 0 0`);
      }

      if (showCos.checked) {
        cosLine.setAttribute('line', `start: 0 0 0; end: ${cos} 0 0`);
        cosHelper.setAttribute('line', `start: ${cos} ${sin} 0; end: ${cos} 0 0`);
      } else {
        cosLine.setAttribute('line', `start: 0 0 0; end: 0 0 0`);
        cosHelper.setAttribute('line', `start: 0 0 0; end: 0 0 0`);
      }

      if (showTan.checked && Math.abs(cos) > 0.01 && Math.abs(tan) < 10) {
        const tanY = sin / cos;
        tanLine.setAttribute('line', `start: 1 0 0; end: 1 ${tanY} 0`);
        tanHelper.setAttribute('line', `start: 1 ${tanY} 0; end: ${cos} ${sin} 0`);
      } else {
        tanLine.setAttribute('line', `start: 0 0 0; end: 0 0 0`);
        tanHelper.setAttribute('line', `start: 0 0 0; end: 0 0 0`);
      }
    }

    let lastAnimationTime = 0;
    function animate(currentTime) {
      if (!animating) return;
      
      const deltaTime = currentTime - lastAnimationTime;
      const targetInterval = 16 / animationSpeed;
      
      if (deltaTime >= targetInterval) {
        angle = (angle + 1) % 360;
        angleSlider.value = angle;
        updateScene();
        lastAnimationTime = currentTime;
      }
      
      requestAnimationFrame(animate);
    }

    // Event listeners
    angleSlider.addEventListener('input', () => {
      angle = parseInt(angleSlider.value);
      updateScene();
    });

    animateCheck.addEventListener('change', () => {
      animating = animateCheck.checked;
      if (animating) {
        lastAnimationTime = performance.now();
        animate(lastAnimationTime);
      }
    });

    cameraToggle.addEventListener('click', () => {
      console.log('Кнопка камери натиснута. Поточний стан:', cameraActive);
      
      if (cameraActive) {
        stopCamera();
      } else {
        startCamera();
      }
    });

    // Обробники кнопок емоцій
    emotionButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (!cameraActive) {
          console.log('Ручна зміна емоції:', btn.dataset.emotion);
          updateEmotion(btn.dataset.emotion);
        }
      });
    });

    // Ініціалізація
    updateScene();
    
    // Перевірка підтримки getUserMedia
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      console.log('✅ getUserMedia підтримується');
      detectionInfo.textContent = 'Натисніть кнопку камери для тесту';
    } else {
      console.log('❌ getUserMedia НЕ підтримується');
      detectionInfo.textContent = 'Камера не підтримується браузером';
      cameraToggle.disabled = true;
    }
  </script>
</body>
</html>
