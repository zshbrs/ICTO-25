<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Земля–Місяць</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>

      <!-- Маркер -->
      <a-marker type="pattern" url="../images/pattern-The_Earth_seen_from_Apollo_17.patt">

        <!-- Освітлення -->
        <a-entity light="type: point; color: white; intensity: 2; distance: 100" position="30 0 0"></a-entity>
        <a-entity light="type: ambient; color: #666"></a-entity>

        <!-- Земля -->
        <a-entity id="earth"
                  geometry="primitive: sphere; radius: 0.064"
                  material="src: ../images/2k_earth_daymap.jpg"
                  rotation="0 0 0"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 5060">
        </a-entity>

        <!-- Місяць обертається навколо Землі -->
        <a-entity id="moon-orbit"
                  position="0 0 0"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 141680">

          <!-- Місяць -->
          <a-entity id="moon"
                    geometry="primitive: sphere; radius: 0.0174"
                    material="src: ../images/2k_moon.jpg"
                    position="0.2 0 0">
          </a-entity>

        </a-entity>

      </a-marker>

      <!-- Камера -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
