<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Земля–Місяць</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>

      <!-- AR-маркер -->
      <a-marker type="pattern" url="../images/pattern-The_Earth_seen_from_Apollo_17.patt">

        <!-- Світло -->
        <a-entity light="type: ambient; color: #777"></a-entity>
        <a-entity light="type: point; color: white; intensity: 1.5; distance: 1" position="0.5 0.5 0.5"></a-entity>

        <!-- Обертання Землі -->
        <a-entity id="earth"
                  geometry="primitive: sphere; radius: 0.064"
                  material="src: ../images/2k_earth_daymap.jpg"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
        </a-entity>

        <!-- Місяць обертається навколо Землі -->
        <a-entity id="moon-orbit"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 14000">
          <a-entity id="moon"
                    geometry="primitive: sphere; radius: 0.0174"
                    material="src: ../images/2k_moon.jpg"
                    position="0.2 0 0">
          </a-entity>
        </a-entity>

      </a-marker>

      <!-- Камера -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
