<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Модель Земля–Місяць</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="planet0.js"></script>
</head>
<body>

<a-scene>
  <!-- Фон -->
  <a-sky src="../images/2k_stars_milky_way.jpg"></a-sky>

  <!-- Камера -->
  <a-camera position="0 0 25"></a-camera>

  <!-- Світло -->
  <a-entity light="type: ambient; color: #888"></a-entity>
  <a-entity light="type: point; color: white; intensity: 2" position="10 10 10"></a-entity>

  <!-- Земля -->
  <a-entity id="earth"
            geometry="primitive: sphere; radius: 6.4"
            material="src: ../images/2k_earth_daymap.jpg"
            planet="name: Earth; dist: 0; mass: 6e24; T: 0; fixed: true"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 5060">
  </a-entity>

  <!-- Місяць -->
  <a-entity id="moon"
            geometry="primitive: sphere; radius: 1.74"
            material="src: ../images/2k_moon.jpg"
            planet="name: Moon; dist: 20; mass: 7.34e22; T: 28">
  </a-entity>

  <!-- Фізика -->
  <a-entity main></a-entity>
</a-scene>

</body>
</html>
