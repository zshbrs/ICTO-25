<a-scene>
  <a-sky src="../images/2k_stars_milky_way.jpg"></a-sky>

  <!-- Камера -->
  <a-camera position="0 10 80"></a-camera>

  <!-- Джерело світла -->
  <a-entity light="type: point; color: white; intensity: 2; distance: 100"
            position="30 0 0"></a-entity>
  <a-entity light="type: ambient; color: #555"></a-entity>

  <!-- Земля з обертанням -->
  <a-entity id="earth"
            geometry="primitive: sphere; radius: 6.4"
            material="src: ../images/2k_earth_daymap.jpg"
            planet="name: Earth; dist: 0; mass: 6e24; T: 1"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 5060">
  </a-entity>

  <!-- Місяць на орбіті -->
  <a-entity id="moon-orbit"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 590000">
    <a-entity id="moon"
              geometry="primitive: sphere; radius: 1.74"
              material="src: ../images/2k_moon.jpg"
              position="38.4 0 0">
    </a-entity>
  </a-entity>
</a-scene>
