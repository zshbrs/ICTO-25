<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Земля і Місяць — гравітаційна модель</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="planet.js"></script>
</head>
<body>
  <a-scene>
    <!-- Небо -->
    <a-sky src="../images/2k_stars_milky_way.jpg"></a-sky>

    <!-- Камера -->
    <a-camera position="0 10 80"></a-camera>

    <!-- Джерело світла (Сонце на відстані 30 000 км = 30 одиниць) -->
    <a-entity light="type: point; color: white; intensity: 2; distance: 100"
              position="30 0 0"></a-entity>
    <a-entity light="type: ambient; color: #555"></a-entity>

    <!-- Земля (масштаб: 1 одиниця = 1000 км) -->
    <a-entity id="earth"
              geometry="primitive: sphere; radius: 6.4"
              material="src: ../images/2k_earth_daymap.jpg"
              planet="name: Earth; dist: 0; mass: 6e24; T: 1">
    </a-entity>

    <!-- Місяць -->
    <a-entity id="moon"
              geometry="primitive: sphere; radius: 1.74"
              material="src: ../images/2k_moon.jpg"
              planet="name: Moon; dist: 38400; mass: 7.34e22; T: 28">
    </a-entity>

    <!-- Основний фізичний компонент -->
    <a-entity main></a-entity>
  </a-scene>
</body>
</html>
