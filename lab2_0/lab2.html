<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MindAR Земля–Місяць</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { position: absolute; top: 0; left: 0; }
    </style>
  </head>
  <body>
    <script type="module">
      import {loadGLTF} from "https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/three/loaders.js";

      const mindarThree = new window.MINDAR.IMAGE.MindARThree({
        container: document.body,
        imageTargetSrc: "./earth.mind", // файл маркера залишається в тій же папці
      });

      const {renderer, scene, camera} = mindarThree;

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      const anchor = mindarThree.addAnchor(0);

      const earthGroup = new THREE.Group();
      const moonGroup = new THREE.Group();

      // Земля
      const earthTexture = new THREE.TextureLoader().load('../images/2k_earth_daymap.jpg');
      const earthGeometry = new THREE.SphereGeometry(0.064, 32, 32);
      const earthMaterial = new THREE.MeshStandardMaterial({map: earthTexture});
      const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
      earthGroup.add(earthMesh);

      // Місяць
      const moonTexture = new THREE.TextureLoader().load('../images/2k_moon.jpg');
      const moonGeometry = new THREE.SphereGeometry(0.0174, 32, 32);
      const moonMaterial = new THREE.MeshStandardMaterial({map: moonTexture});
      const moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
      moonMesh.position.set(0.2, 0, 0);
      moonGroup.add(moonMesh);

      earthGroup.add(moonGroup);
      anchor.group.add(earthGroup);

      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        earthMesh.rotation.y += 0.01;
        moonGroup.rotation.y += 0.0022;
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
