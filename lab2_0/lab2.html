<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MindAR Земля–Місяць</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { position: absolute; top: 0; left: 0; }
    </style>
  </head>
  <body>
    <script type="module">
      async function startAR() {
        const mindarThree = new window.MINDAR.IMAGE.MindARThree({
          container: document.body,
          imageTargetSrc: "./earth.mind"
        });

        const {renderer, scene, camera} = mindarThree;

        // Яскраве світло
        const light = new THREE.PointLight(0xffffff, 2);
        light.position.set(1, 1, 1);
        scene.add(light);

        const anchor = mindarThree.addAnchor(0);

        // Земля
        const earthTexture = new THREE.TextureLoader().load('../images/2k_earth_daymap.jpg');
        const earthGeometry = new THREE.SphereGeometry(0.2, 32, 32); // більша сфера для видимості
        const earthMaterial = new THREE.MeshStandardMaterial({ map: earthTexture });
        const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);

        // Місяць
        const moonTexture = new THREE.TextureLoader().load('../images/2k_moon.jpg');
        const moonGeometry = new THREE.SphereGeometry(0.07, 32, 32);
        const moonMaterial = new THREE.MeshStandardMaterial({ map: moonTexture });
        const moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
        moonMesh.position.set(0.5, 0, 0);

        const moonGroup = new THREE.Group();
        moonGroup.add(moonMesh);

        const earthGroup = new THREE.Group();
        earthGroup.add(earthMesh);
        earthGroup.add(moonGroup);

        anchor.group.add(earthGroup);

        await mindarThree.start();

        // Обертання
        renderer.setAnimationLoop(() => {
          earthMesh.rotation.y += 0.01;
          moonGroup.rotation.y += 0.002;
          renderer.render(scene, camera);
        });
      }

      startAR();
    </script>
  </body>
</html>
