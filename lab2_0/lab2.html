<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Земля–Місяць (Three.js + MindAR)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
    
    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        width: 100vw; 
        height: 100vh; 
      }
      #ar-scene-container {
        position: absolute; 
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="ar-scene-container"></div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const arSceneContainer = document.getElementById('ar-scene-container');

        // Ініціалізація MindAR
        const mindarThree = new MINDAR.IMAGE.MindARThree({
          container: arSceneContainer,
          imageTargetSrc: './earth.mind', // Шлях до файлу маркера (припускаємо, він у тій же папці, що й index.html)
        });

        const { renderer, scene, camera } = mindarThree;

        // --- Налаштування освітлення ---
        const ambientLight = new THREE.AmbientLight(0x777777);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1.5, 100);
        pointLight.position.set(0.5, 0.5, 0.5);
        scene.add(pointLight);

        // --- Модель Землі ---
        const earthGeometry = new THREE.SphereGeometry(0.064, 32, 32);
        
        // **ВИПРАВЛЕНИЙ ШЛЯХ ДО ЗОБРАЖЕННЯ ЗЕМЛІ**
        const earthTextureLoader = new THREE.TextureLoader();
        const earthTexture = earthTextureLoader.load('../images/2k_earth_daymap.jpg'); 
        const earthMaterial = new THREE.MeshBasicMaterial({ map: earthTexture });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        
        earth.rotationSpeed = (Math.PI * 2) / (5000 / 16.66); 

        // --- Модель Місяця ---
        const moonGeometry = new THREE.SphereGeometry(0.0174, 32, 32); 
        
        // **ВИПРАВЛЕНИЙ ШЛЯХ ДО ЗОБРАЖЕННЯ МІСЯЦЯ**
        const moonTextureLoader = new THREE.TextureLoader();
        const moonTexture = moonTextureLoader.load('../images/2k_moon.jpg');
        const moonMaterial = new THREE.MeshBasicMaterial({ map: moonTexture });
        const moon = new THREE.Mesh(moonGeometry, moonMaterial);
        
        moon.position.set(0.2, 0, 0); 

        const moonOrbitGroup = new THREE.Group();
        moonOrbitGroup.add(moon); 

        moonOrbitGroup.rotationSpeed = (Math.PI * 2) / (14000 / 16.66);

        // --- Додавання об'єктів до сцени після виявлення маркера ---
        const anchor = mindarThree.addAnchor(0); 
        anchor.group.add(earth); 
        anchor.group.add(moonOrbitGroup); 

        // --- Анімаційний цикл ---
        const animate = () => {
          earth.rotation.y += earth.rotationSpeed;
          moonOrbitGroup.rotation.y += moonOrbitGroup.rotationSpeed;

          renderer.render(scene, camera);
          requestAnimationFrame(animate); 
        };

        // Запуск AR досвіду та анімації
        mindarThree.start().then(() => {
          console.log("MindAR розпочато!");
          animate(); 
        });

        // Обробка зміни розміру вікна
        window.addEventListener('resize', () => {
          const { width, height } = arSceneContainer.getBoundingClientRect();
          renderer.setSize(width, height);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        });
      });
    </script>
  </body>
</html>
