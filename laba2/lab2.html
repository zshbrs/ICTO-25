<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth-Moon AR</title>

    <!-- MindAR з CDN - стабільна версія -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        font-family: Arial, sans-serif;
        background: #000;
      }
      #ar-container { 
        width: 100vw; 
        height: 100vh; 
        position: relative; 
      }
      #status {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0,0,0,0.7);
        padding: 10px;
        border-radius: 5px;
        z-index: 1000;
        font-size: 14px;
      }
      #instructions {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: rgba(0,0,0,0.7);
        padding: 15px;
        border-radius: 10px;
        text-align: center;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="status">Ініціалізація...</div>
    <div id="instructions">Направте камеру на маркер</div>
    <div id="ar-container"></div>

    <script src="./main.js"></script>
  </body>
</html>
