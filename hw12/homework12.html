<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR-сцена з двома моделями</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">
    <!-- Завантажувач -->
    <div class="arjs-loader">
        <div>Завантаження AR, будь ласка зачекайте...</div>
    </div>

    <!-- Інформація про керування -->
    <div class="controls">
        <div>📱 Наведіть камеру на маркер</div>
        <div>👆 Натисніть на об'єкти для взаємодії</div>
    </div>

    <script>
        // Компонент для анімації обертання
        AFRAME.registerComponent('rotation-animation', {
            schema: {
                speed: {default: 1}
            },
            init: function () {
                var el = this.el;
                var data = this.data;
                
                // Анімація обертання навколо Y-осі
                el.setAttribute('animation', {
                    property: 'rotation',
                    to: '0 360 0',
                    loop: true,
                    dur: 5000 / data.speed
                });
            }
        });

        // Компонент для стрибка при кліку
        AFRAME.registerComponent('bounce-on-click', {
            init: function () {
                var el = this.el;
                var originalPosition = el.getAttribute('position');
                
                el.addEventListener('click', function () {
                    // Анімація стрибка
                    el.setAttribute('animation__bounce', {
                        property: 'position.y',
                        to: originalPosition.y + 2,
                        dur: 300,
                        easing: 'easeOutQuad',
                        dir: 'alternate',
                        loop: 1
                    });
                    
                    console.log('Клік на об\'єкт!');
                });
            }
        });

        // Компонент для зміни кольору при кліку
        AFRAME.registerComponent('color-change-click', {
            schema: {
                colors: {default: ['red', 'blue', 'green', 'yellow', 'purple', 'orange']}
            },
            init: function () {
                var el = this.el;
                var data = this.data;
                var colorIndex = 0;
                
                el.addEventListener('click', function () {
                    colorIndex = (colorIndex + 1) % data.colors.length;
                    el.setAttribute('material', 'color', data.colors[colorIndex]);
                });
            }
        });
    </script>

    <a-scene 
        vr-mode-ui="enabled: false;" 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <!-- Маркер для запуску AR -->
        <a-marker preset="hiro">
            
            <!-- Ліва модель: Тор з анімацією -->
            <a-torus 
                position="-3 0.5 0" 
                color="#FF6B6B" 
                radius="1" 
                radius-tubular="0.2"
                rotation-animation="speed: 1.5"
                bounce-on-click
                color-change-click="colors: #FF6B6B, #4ECDC4, #45B7D1, #96CEB4, #FFEAA7"
                shadow="cast: true; receive: true">
                
                <!-- Додаємо текст над об'єктом -->
                <a-text 
                    value="ЛІВА МОДЕЛЬ" 
                    position="0 2 0" 
                    align="center" 
                    color="#FFFFFF"
                    scale="0.8 0.8 0.8">
                </a-text>
            </a-torus>

            <!-- Права модель: Додекаедр з анімацією -->
            <a-dodecahedron 
                position="3 1 0" 
                color="#4ECDC4" 
                radius="1"
                rotation-animation="speed: 0.8"
                bounce-on-click
                color-change-click="colors: #4ECDC4, #FF6B6B, #96CEB4, #FFEAA7, #DDA0DD"
                shadow="cast: true; receive: true">
                
                <!-- Текст над правою моделлю -->
                <a-text 
                    value="ПРАВА МОДЕЛЬ" 
                    position="0 2.5 0" 
                    align="center" 
                    color="#FFFFFF"
                    scale="0.8 0.8 0.8">
                </a-text>
            </a-dodecahedron>

            <!-- Центральний елемент для орієнтації -->
            <a-cylinder 
                position="0 0.1 0" 
                color="#DDA0DD" 
                radius="0.3" 
                height="0.2"
                opacity="0.7">
                
                <a-text 
                    value="ЦЕНТР" 
                    position="0 0.5 0" 
                    align="center" 
                    color="#FFFFFF"
                    scale="0.6 0.6 0.6">
                </a-text>
            </a-cylinder>

            <!-- Площина-основа для тіней -->
            <a-plane 
                position="0 -0.1 0" 
                rotation="-90 0 0" 
                width="8" 
                height="8" 
                color="#CCCCCC" 
                opacity="0.3"
                shadow="receive: true">
            </a-plane>

            <!-- Додаткові декоративні елементи -->
            <a-sphere 
                position="-1.5 0.2 -2" 
                color="#96CEB4" 
                radius="0.3"
                rotation-animation="speed: 2"
                opacity="0.8">
            </a-sphere>

            <a-sphere 
                position="1.5 0.2 -2" 
                color="#FFEAA7" 
                radius="0.3"
                rotation-animation="speed: 2.5"
                opacity="0.8">
            </a-sphere>

        </a-marker>

        <!-- Камера з курсором для взаємодії -->
        <a-entity camera>
            <a-cursor 
                color="#FFFFFF"
                raycaster="objects: a-torus, a-dodecahedron, a-sphere">
            </a-cursor>
        </a-entity>
        
        <!-- Освітлення -->
        <a-light type="ambient" color="#FFFFFF" intensity="0.4"></a-light>
        <a-light type="directional" position="2 4 5" intensity="0.8" shadow="cast: true"></a-light>
    </a-scene>
</body>
</html>
