<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Earth-Moon WebXR Scene</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #000428, #004e92);
    }
    
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }
    
    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
      backdrop-filter: blur(10px);
    }
    
    #controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    
    button {
      background: linear-gradient(45deg, #667eea, #764ba2);
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      color: white;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      pointer-events: auto;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    #ar-button {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(45deg, #ff6b6b, #ee5a24);
      font-size: 16px;
      padding: 15px 25px;
      pointer-events: auto;
    }
    
    .highlight {
      color: #64b5f6;
      font-weight: bold;
    }
    
    #status {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 12px;
      pointer-events: auto;
      backdrop-filter: blur(10px);
    }
    
    .status-ready { color: #4caf50; }
    .status-active { color: #2196f3; }
    .status-error { color: #f44336; }
    
    #instructions {
      position: absolute;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 12px;
      text-align: center;
      max-width: 300px;
      pointer-events: auto;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div id="container"></div>
  
  <div id="ui-overlay">
    <div id="info-panel">
      <div style="font-size: 16px; margin-bottom: 10px;">🌍 Система Земля-Місяць</div>
      <div>Масштаб часу: <span class="highlight">1:17,000</span></div>
      <div id="day-counter">День: <span class="highlight">0</span></div>
      <div id="moon-phase">Фаза Місяця: <span class="highlight">Новий</span></div>
      <div style="margin-top: 10px; font-size: 12px;">
        <div>🌍 Період обертання Землі: <span class="highlight">1 доба</span></div>
        <div>🌙 Період обертання Місяця: <span class="highlight">28 діб</span></div>
      </div>
    </div>
    
    <div id="status">
      <div id="webxr-status">WebXR: <span class="status-ready">Перевірка...</span></div>
      <div id="session-status">Сесія: <span>Неактивна</span></div>
    </div>
    
    <div id="instructions">
      <div>📱 Натисніть кнопку AR для запуску доповненої реальності</div>
      <div style="margin-top: 10px; font-size: 10px; opacity: 0.8;">
        Направте камеру на плоску поверхню для розміщення сцени
      </div>
    </div>
    
    <button id="ar-button">🚀 Запустити AR</button>
    
    <div id="controls">
      <button onclick="toggleAnimation()">⏸️ Пауза</button>
      <button onclick="resetAnimation()">🔄 Скинути</button>
      <button onclick="changeSpeed()">⚡ x1</button>
      <button onclick="toggleOrbit()">🛰️ Орбіта</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/webxr/ARButton.js';
    
    // Змінні сцени
    let scene, camera, renderer;
    let earth, moon, moonOrbit, earthMoonSystem;
    let reticle, hitTestSource, hitTestSourceRequested = false;
    
    // Змінні анімації
    let isAnimating = true;
    let animationSpeed = 1;
    let earthRotation = 0;
    let moonOrbitRotation = 0;
    let dayCounter = 0;
    let showOrbit = true;
    let orbitRing;
    
    const clock = new THREE.Clock();
    
    // Ініціалізація сцени
    function init() {
      // Створення контейнера
      const container = document.getElementById('container');
      
      // Сцена
      scene = new THREE.Scene();
      
      // Камера
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
      
      // Рендерер з підтримкою WebXR
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);
      
      // Перевірка підтримки WebXR
      checkWebXRSupport();
      
      // Створення AR кнопки
      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.getElementById('ui-overlay') }
      });
      
      // Заміна стандартної кнопки на нашу
      const customARButton = document.getElementById('ar-button');
      customARButton.addEventListener('click', () => {
        arButton.click();
      });
      
      // Обробники подій WebXR
      renderer.xr.addEventListener('sessionstart', onSessionStart);
      renderer.xr.addEventListener('sessionend', onSessionEnd);
      
      // Створення системи Земля-Місяць
      createEarthMoonSystem();
      
      // Створення reticle для розміщення об'єктів
      createReticle();
      
      // Освітлення
      setupLighting();
      
      // Запуск анімації
      renderer.setAnimationLoop(animate);
      
      // Обробка зміни розміру
      window.addEventListener('resize', onWindowResize);
      
      // Початкове розташування в звичайному режимі
      earthMoonSystem.position.set(0, 0, -2);
      earthMoonSystem.scale.setScalar(0.3);
    }
    
    function checkWebXRSupport() {
      const statusElement = document.getElementById('webxr-status');
      
      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
          if (supported) {
            statusElement.innerHTML = 'WebXR: <span class="status-ready">Готово</span>';
          } else {
            statusElement.innerHTML = 'WebXR: <span class="status-error">AR не підтримується</span>';
            document.getElementById('ar-button').style.display = 'none';
            document.getElementById('instructions').innerHTML = 
              '<div>❌ Ваш пристрій не підтримує WebXR AR</div>' +
              '<div style="margin-top: 10px; font-size: 10px;">Спробуйте використати Chrome на Android</div>';
          }
        }).catch(() => {
          statusElement.innerHTML = 'WebXR: <span class="status-error">Недоступно</span>';
        });
      } else {
        statusElement.innerHTML = 'WebXR: <span class="status-error">Не підтримується</span>';
      }
    }
    
    function createEarthMoonSystem() {
      // Група для всієї системи
      earthMoonSystem = new THREE.Group();
      
      // Створення Землі
      const earthGeometry = new THREE.SphereGeometry(0.6, 32, 64);
      const earthMaterial = createEarthMaterial();
      
      earth = new THREE.Mesh(earthGeometry, earthMaterial);
      earth.castShadow = true;
      earth.receiveShadow = true;
      earth.position.set(0, 0, 0);
      earthMoonSystem.add(earth);
      
      // Створення системи Місяця
      const moonGeometry = new THREE.SphereGeometry(0.1632, 32, 64);
      const moonMaterial = createMoonMaterial();
      
      moon = new THREE.Mesh(moonGeometry, moonMaterial);
      moon.castShadow = true;
      moon.receiveShadow = true;
      moon.position.set(3.6, 0, 0);
      
      moonOrbit = new THREE.Group();
      moonOrbit.add(moon);
      moonOrbit.position.set(0, 0, 0);
      earthMoonSystem.add(moonOrbit);
      
      // Орбіта Місяця
      createMoonOrbit();
      
      scene.add(earthMoonSystem);
    }
    
    function createEarthMaterial() {
      // Створення процедурної текстури Землі
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      
      // Океани
      const gradient = ctx.createLinearGradient(0, 0, 512, 256);
      gradient.addColorStop(0, '#4a90e2');
      gradient.addColorStop(0.3, '#7bb3f0');
      gradient.addColorStop(0.7, '#357abd');
      gradient.addColorStop(1, '#2e5c8a');
      
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 256);
      
      // Континенти
      ctx.fillStyle = '#4a7c59';
      const continents = [
        {x: 100, y: 100, r: 40},
        {x: 250, y: 80, r: 60},
        {x: 400, y: 120, r: 45},
        {x: 80, y: 180, r: 35},
        {x: 300, y: 160, r: 50},
        {x: 450, y: 200, r: 30}
      ];
      
      continents.forEach(cont => {
        ctx.beginPath();
        ctx.arc(cont.x, cont.y, cont.r, 0, Math.PI * 2);
        ctx.fill();
      });
      
      // Хмари
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      for (let i = 0; i < 20; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 256;
        const r = Math.random() * 20 + 10;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      
      const texture = new THREE.CanvasTexture(canvas);
      return new THREE.MeshStandardMaterial({ 
        map: texture,
        roughness: 0.8,
        metalness: 0.1
      });
    }
    
    function createMoonMaterial() {
      // Створення процедурної текстури Місяця
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      
      // Базовий колір
      ctx.fillStyle = '#c0c0c0';
      ctx.fillRect(0, 0, 256, 128);
      
      // Кратери
      ctx.fillStyle = '#a0a0a0';
      const craters = [
        {x: 50, y: 40, r: 12},
        {x: 120, y: 30, r: 8},
        {x: 200, y: 50, r: 15},
        {x: 80, y: 80, r: 10},
        {x: 180, y: 90, r: 7},
        {x: 30, y: 100, r: 6},
        {x: 220, y: 100, r: 9}
      ];
      
      craters.forEach(crater => {
        ctx.beginPath();
        ctx.arc(crater.x, crater.y, crater.r, 0, Math.PI * 2);
        ctx.fill();
        
        // Тіні кратерів
        ctx.fillStyle = '#909090';
        ctx.beginPath();
        ctx.arc(crater.x + 2, crater.y + 2, crater.r * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#a0a0a0';
      });
      
      const texture = new THREE.CanvasTexture(canvas);
      return new THREE.MeshStandardMaterial({ 
        map: texture,
        roughness: 0.9,
        metalness: 0.0
      });
    }
    
    function createMoonOrbit() {
      const orbitGeometry = new THREE.RingGeometry(3.58, 3.62, 64);
      const orbitMaterial = new THREE.MeshBasicMaterial({ 
        color: 0x64b5f6, 
        transparent: true, 
        opacity: 0.3,
        side: THREE.DoubleSide 
      });
      orbitRing = new THREE.Mesh(orbitGeometry, orbitMaterial);
      orbitRing.rotation.x = Math.PI / 2;
      earthMoonSystem.add(orbitRing);
    }
    
    function createReticle() {
      const geometry = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
      const material = new THREE.MeshBasicMaterial({ 
        color: 0x64b5f6,
        transparent: true,
        opacity: 0.8
      });
      reticle = new THREE.Mesh(geometry, material);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);
    }
    
    function setupLighting() {
      // Сонячне світло
      const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
      sunLight.position.set(10, 10, 5);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 0.1;
      sunLight.shadow.camera.far = 50;
      sunLight.shadow.camera.left = -10;
      sunLight.shadow.camera.right = 10;
      sunLight.shadow.camera.top = 10;
      sunLight.shadow.camera.bottom = -10;
      scene.add(sunLight);
      
      // Навколишнє освітлення
      const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
      scene.add(ambientLight);
    }
    
    function onSessionStart() {
      document.getElementById('session-status').innerHTML = 'Сесія: <span class="status-active">Активна</span>';
      document.getElementById('instructions').innerHTML = 
        '<div>🎯 Направте камеру на поверхню та торкніться для розміщення системи</div>';
      
      const session = renderer.xr.getSession();
      session.requestReferenceSpace('viewer').then((referenceSpace) => {
        session.requestHitTestSource({ space: referenceSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      
      session.addEventListener('end', onSessionEnd);
      session.addEventListener('select', onSelect);
      
      hitTestSourceRequested = true;
    }
    
    function onSessionEnd() {
      document.getElementById('session-status').innerHTML = 'Сесія: <span>Неактивна</span>';
      document.getElementById('instructions').innerHTML = 
        '<div>📱 Натисніть кнопку AR для запуску доповненої реальності</div>';
      
      hitTestSourceRequested = false;
      hitTestSource = null;
      reticle.visible = false;
      
      // Повернення до звичайного режиму
      earthMoonSystem.position.set(0, 0, -2);
      earthMoonSystem.scale.setScalar(0.3);
    }
    
    function onSelect() {
      if (reticle.visible) {
        // Розміщення системи Земля-Місяць на вибраній поверхні
        earthMoonSystem.position.setFromMatrixPosition(reticle.matrix);
        earthMoonSystem.scale.setScalar(0.1); // Зменшення для AR
        reticle.visible = false;
      }
    }
    
    function animate() {
      const delta = clock.getDelta();
      
      if (isAnimating) {
        const timeMultiplier = animationSpeed;
        
        // Обертання Землі
        const earthRotationSpeed = (2 * Math.PI / 5.08) * delta * timeMultiplier;
        earthRotation += earthRotationSpeed;
        if (earth) {
          earth.rotation.y = earthRotation;
        }
        
        // Обертання Місяця навколо Землі
        const moonOrbitSpeed = (2 * Math.PI / 142.24) * delta * timeMultiplier;
        moonOrbitRotation += moonOrbitSpeed;
        if (moonOrbit) {
          moonOrbit.rotation.y = moonOrbitRotation;
        }
        
        // Синхронне обертання Місяця
        if (moon) {
          moon.rotation.y = -moonOrbitRotation;
        }
        
        // Оновлення UI
        updateUI();
      }
      
      // Hit testing для AR
      if (renderer.xr.isPresenting) {
        if (hitTestSourceRequested === false) {
          requestHitTestSource();
        }
        
        if (hitTestSource) {
          updateReticle();
        }
      }
      
      renderer.render(scene, camera);
    }
    
    function requestHitTestSource() {
      const session = renderer.xr.getSession();
      session.requestReferenceSpace('viewer').then((referenceSpace) => {
        session.requestHitTestSource({ space: referenceSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      hitTestSourceRequested = true;
    }
    
    function updateReticle() {
      const session = renderer.xr.getSession();
      const frame = renderer.xr.getFrame();
      
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        
        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          reticle.visible = true;
          reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
        } else {
          reticle.visible = false;
        }
      }
    }
    
    function updateUI() {
      // Підрахунок днів
      dayCounter = (earthRotation / (2 * Math.PI)) % 365;
      document.getElementById('day-counter').innerHTML = 
        `День: <span class="highlight">${Math.floor(dayCounter)}</span>`;
      
      // Фаза Місяця
      const moonPhase = ((moonOrbitRotation / (2 * Math.PI)) % 1) * 28;
      let phaseName = 'Новий';
      if (moonPhase < 3.5) phaseName = 'Новий';
      else if (moonPhase < 7) phaseName = 'Молодик';
      else if (moonPhase < 10.5) phaseName = 'Перша чверть';
      else if (moonPhase < 14) phaseName = 'Зростаючий';
      else if (moonPhase < 17.5) phaseName = 'Повний';
      else if (moonPhase < 21) phaseName = 'Спадаючий';
      else if (moonPhase < 24.5) phaseName = 'Остання чверть';
      else phaseName = 'Старий';
      
      document.getElementById('moon-phase').innerHTML = 
        `Фаза Місяця: <span class="highlight">${phaseName}</span>`;
    }
    
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // Глобальні функції управління
    window.toggleAnimation = () => {
      isAnimating = !isAnimating;
      const button = event.target;
      button.innerHTML = isAnimating ? '⏸️ Пауза' : '▶️ Старт';
      if (!isAnimating) {
        clock.getDelta();
      }
    };
    
    window.resetAnimation = () => {
      earthRotation = 0;
      moonOrbitRotation = 0;
      dayCounter = 0;
      if (earth) earth.rotation.y = 0;
      if (moonOrbit) moonOrbit.rotation.y = 0;
      if (moon) moon.rotation.y = 0;
      clock.getDelta();
    };
    
    window.changeSpeed = () => {
      animationSpeed = animationSpeed === 1 ? 5 : animationSpeed === 5 ? 10 : 1;
      event.target.innerHTML = `⚡ x${animationSpeed}`;
    };
    
    window.toggleOrbit = () => {
      showOrbit = !showOrbit;
      if (orbitRing) {
        orbitRing.visible = showOrbit;
      }
      event.target.innerHTML = showOrbit ? '🛰️ Орбіта' : '🛰️ Без орбіти';
    };
    
    // Запуск ініціалізації
    init();
  </script>
</body>
</html>
