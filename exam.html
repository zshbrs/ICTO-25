
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Тригонометричні функції - Одиничне коло та графік</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Arial', sans-serif; 
            background: #001122;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }
        
        .left-panel {
            width: 50%;
            position: relative;
            border-right: 2px solid #333;
            background: #001122;
        }
        
        .right-panel {
            width: 50%;
            position: relative;
            background: #000811;
        }
        
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            font-size: 14px;
            min-width: 250px;
        }
        
        .control-group {
            margin-bottom: 12px;
        }
        
        .slider {
            width: 200px;
            margin: 5px 0;
        }
        
        .function-selector {
            margin: 10px 0;
        }
        
        .function-selector label {
            display: block;
            margin: 5px 0;
            cursor: pointer;
        }
        
        .function-selector input[type="checkbox"] {
            margin-right: 8px;
        }
        
        .values {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .sin-color { color: #3498db; }
        .cos-color { color: #e74c3c; }
        .tan-color { color: #2ecc71; }
        
        .circle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #001122;
        }
        
        .graph-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000811;
        }
        
        .graph-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 1000;
            font-size: 12px;
        }
        
        button {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
        }
        
        button:hover {
            background: #34495e;
        }
        
        button.active {
            background: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Ліва панель - одиничне коло -->
        <div class="left-panel">
            <div class="controls">
                <div class="control-group">
                    <label>Кут: <span id="angleDisplay">0°</span> (<span id="radianDisplay">0.00</span> рад)</label>
                    <input type="range" id="angleSlider" class="slider" min="-720" max="720" value="0" step="1">
                </div>
                
                <div class="function-selector">
                    <label><input type="checkbox" id="showSin" checked> <span class="sin-color">sin(θ)</span></label>
                    <label><input type="checkbox" id="showCos" checked> <span class="cos-color">cos(θ)</span></label>
                    <label><input type="checkbox" id="showTan" checked> <span class="tan-color">tan(θ)</span></label>
                </div>
                
                <div class="control-group">
                    <input type="checkbox" id="animateCheck"> Анімація
                    <button id="resetBtn">Скинути</button>
                </div>
            </div>

            <div class="values">
                <div class="sin-color">sin(θ) = <span id="sinValue">0.000</span></div>
                <div class="cos-color">cos(θ) = <span id="cosValue">1.000</span></div>
                <div class="tan-color">tan(θ) = <span id="tanValue">0.000</span></div>
            </div>

            <canvas id="circleCanvas" class="circle-canvas"></canvas>
        </div>

        <!-- Права панель - графік -->
        <div class="right-panel">
            <div class="graph-controls">
                <div>Функції для графіка:</div>
                <button id="graphSin" class="graph-btn active">sin(θ)</button>
                <button id="graphCos" class="graph-btn">cos(θ)</button>
                <button id="graphTan" class="graph-btn">tan(θ)</button>
                <button id="clearGraph">Очистити</button>
            </div>
            <canvas id="graphCanvas" class="graph-canvas"></canvas>
        </div>
    </div>

    <script>
        let currentAngle = 0;
        let isAnimating = false;
        let animationId;
        let activeGraphs = { sin: true, cos: false, tan: false };

        // DOM елементи
        const angleSlider = document.getElementById('angleSlider');
        const angleDisplay = document.getElementById('angleDisplay');
        const radianDisplay = document.getElementById('radianDisplay');
        const animateCheck = document.getElementById('animateCheck');
        const resetBtn = document.getElementById('resetBtn');
        
        const sinValue = document.getElementById('sinValue');
        const cosValue = document.getElementById('cosValue');
        const tanValue = document.getElementById('tanValue');

        const showSin = document.getElementById('showSin');
        const showCos = document.getElementById('showCos');
        const showTan = document.getElementById('showTan');

        // Canvas елементи
        const circleCanvas = document.getElementById('circleCanvas');
        const circleCtx = circleCanvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const graphCtx = graphCanvas.getContext('2d');
        
        // Кнопки графіків
        const graphSinBtn = document.getElementById('graphSin');
        const graphCosBtn = document.getElementById('graphCos');
        const graphTanBtn = document.getElementById('graphTan');
        const clearGraphBtn = document.getElementById('clearGraph');
        
        function resizeCanvases() {
            circleCanvas.width = circleCanvas.offsetWidth;
            circleCanvas.height = circleCanvas.offsetHeight;
            graphCanvas.width = graphCanvas.offsetWidth;
            graphCanvas.height = graphCanvas.offsetHeight;
            drawCircle();
            drawGraph();
        }
        
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        function drawCircle() {
            const ctx = circleCtx;
            const centerX = circleCanvas.width / 2;
            const centerY = circleCanvas.height / 2;
            
            // Збільшуємо відступи для кращого відображення
            const maxRadius = Math.min(centerX - 100, centerY - 100);
            const radius = Math.max(80, maxRadius * 0.4); // Мінімальний радіус 80px
            
            ctx.clearRect(0, 0, circleCanvas.width, circleCanvas.height);
            
            // Фон
            ctx.fillStyle = '#001122';
            ctx.fillRect(0, 0, circleCanvas.width, circleCanvas.height);
            
            // Одиничне коло
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.stroke();
            
            // Осі координат
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            
            // X-вісь
            ctx.beginPath();
            ctx.moveTo(centerX - radius * 1.4, centerY);
            ctx.lineTo(centerX + radius * 1.4, centerY);
            ctx.stroke();
            
            // Y-вісь
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - radius * 1.4);
            ctx.lineTo(centerX, centerY + radius * 1.4);
            ctx.stroke();
            
            // Градуси навколо кола
            ctx.fillStyle = '#ffffff';
            ctx.font = '11px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const degrees = [0, 30, 45, 60, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330];
            for (let deg of degrees) {
                const rad = (deg * Math.PI) / 180;
                const labelRadius = radius + 30;
                const x = centerX + Math.cos(-rad) * labelRadius;
                const y = centerY + Math.sin(-rad) * labelRadius;
                
                // Перевіряємо, чи підпис поміщається на екрані
                if (x > 20 && x < circleCanvas.width - 20 && y > 20 && y < circleCanvas.height - 20) {
                    ctx.fillText(deg + '°', x, y);
                }
            }
            
            // Мітки на осях
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('1', centerX + radius + 5, centerY + 5);
            ctx.fillText('-1', centerX - radius - 20, centerY + 5);
            ctx.fillText('1', centerX + 5, centerY - radius - 5);
            ctx.fillText('-1', centerX + 5, centerY + radius + 15);
            
            // Розрахунок позицій
            const angleRad = (currentAngle * Math.PI) / 180;
            const cosVal = Math.cos(angleRad);
            const sinVal = Math.sin(angleRad);
            const tanVal = Math.tan(angleRad);
            
            const pointX = centerX + cosVal * radius;
            const pointY = centerY - sinVal * radius;
            
            // Проекції на осі
            const projX = centerX + cosVal * radius;
            const projY = centerY - sinVal * radius;
            
            // Малювання ліній функцій
            if (showCos.checked) {
                // Косинус - горизонтальна лінія
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(projX, centerY);
                ctx.stroke();
                
                // Вертикальна допоміжна лінія
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 2;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(pointX, pointY);
                ctx.lineTo(pointX, centerY);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Точка проекції на X-осі
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(projX, centerY, 4, 0, 2 * Math.PI);
                ctx.fill();
                
                // Підпис косинуса
                ctx.fillStyle = '#e74c3c';
                ctx.font = '12px Arial';
                const cosTextX = centerX + (projX - centerX) / 2;
                const cosTextY = centerY - 15;
                ctx.fillText('cos(θ)', cosTextX - 15, cosTextY);
            }
            
            if (showSin.checked) {
                // Синус - вертикальна лінія
                ctx.strokeStyle = '#3498db';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX, projY);
                ctx.stroke();
                
                // Горизонтальна допоміжна лінія
                ctx.strokeStyle = '#3498db';
                ctx.lineWidth = 2;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(pointX, pointY);
                ctx.lineTo(centerX, pointY);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Точка проекції на Y-осі
                ctx.fillStyle = '#3498db';
                ctx.beginPath();
                ctx.arc(centerX, projY, 4, 0, 2 * Math.PI);
                ctx.fill();
                
                // Підпис синуса
                ctx.fillStyle = '#3498db';
                ctx.font = '12px Arial';
                const sinTextX = centerX + 10;
                const sinTextY = centerY + (projY - centerY) / 2;
                ctx.fillText('sin(θ)', sinTextX, sinTextY);
            }
            
            if (showTan.checked) {
                // Тангенс
                if (Math.abs(cosVal) > 0.001) {
                    const tanX = centerX + radius;
                    const tanY = centerY - tanVal * radius;
                    
                    const maxTanDisplay = 5;
                    if (Math.abs(tanVal) <= maxTanDisplay && 
                        tanY > 20 && tanY < circleCanvas.height - 20) {
                        
                        // Вертикальна дотична лінія
                        ctx.strokeStyle = '#666666';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([5, 5]);
                        ctx.beginPath();
                        ctx.moveTo(tanX, Math.max(20, centerY - radius * 1.3));
                        ctx.lineTo(tanX, Math.min(circleCanvas.height - 20, centerY + radius * 1.3));
                        ctx.stroke();
                        ctx.setLineDash([]);
                        
                        // Лінія від центру до точки на дотичній
                        ctx.strokeStyle = '#2ecc71';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([2, 2]);
                        ctx.beginPath();
                        ctx.moveTo(centerX, centerY);
                        ctx.lineTo(tanX, tanY);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        
                        // Тангенс на дотичній
                        ctx.strokeStyle = '#2ecc71';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(tanX, centerY);
                        ctx.lineTo(tanX, tanY);
                        ctx.stroke();
                        
                        // Точка на дотичній
                        ctx.fillStyle = '#2ecc71';
                        ctx.beginPath();
                        ctx.arc(tanX, tanY, 4, 0, 2 * Math.PI);
                        ctx.fill();
                        
                        // Підпис тангенса
                        ctx.fillStyle = '#2ecc71';
                        ctx.font = '12px Arial';
                        const labelY = tanY > centerY ? tanY + 15 : tanY - 5;
                        if (tanX + 50 < circleCanvas.width) {
                            ctx.fillText('tan(θ)', tanX + 5, labelY);
                        }
                    }
                } else {
                    // Асимптота
                    const tanX = centerX + radius;
                    if (tanX + 50 < circleCanvas.width) {
                        ctx.strokeStyle = '#ff6b6b';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([3, 3]);
                        ctx.beginPath();
                        ctx.moveTo(tanX, Math.max(20, centerY - radius * 1.3));
                        ctx.lineTo(tanX, Math.min(circleCanvas.height - 20, centerY + radius * 1.3));
                        ctx.stroke();
                        ctx.setLineDash([]);
                        
                        ctx.fillStyle = '#ff6b6b';
                        ctx.font = '12px Arial';
                        ctx.fillText('tan(θ) = ∞', tanX + 5, centerY);
                    }
                }
            }
            
            // Радіус-вектор
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(pointX, pointY);
            ctx.stroke();
            
            // Точка на колі
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(pointX, pointY, 6, 0, 2 * Math.PI);
            ctx.fill();
            
            // Кут (дуга)
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, -angleRad, angleRad < 0);
            ctx.stroke();
        }

        function drawGraph() {
            const ctx = graphCtx;
            ctx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
            
            const centerY = graphCanvas.height / 2;
            const centerX = graphCanvas.width / 2;
            const scaleX = graphCanvas.width / (6 * Math.PI);
            const scaleY = graphCanvas.height / 6;
            
            // Сітка
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            
            // Горизонтальні лінії
            for (let i = -3; i <= 3; i++) {
                const y = centerY - i * scaleY / 3;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(graphCanvas.width, y);
                ctx.stroke();
            }
            
            // Вертикальні лінії
            const piSteps = [-3, -2.5, -2, -1.5, -1, -0.5, 0, 0.5, 1, 1.5, 2, 2.5, 3];
            for (let step of piSteps) {
                const x = centerX + step * scaleX * Math.PI;
                if (x >= 0 && x <= graphCanvas.width) {
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([]);
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, graphCanvas.height);
                    ctx.stroke();
                }
            }
            
            // ВИПРАВЛЕНО: Асимптоти для тангенса в правильних місцях
            if (activeGraphs.tan) {
                // Асимптоти тангенса в точках π/2 + πk
                const asymptotes = [-2.5, -1.5, -0.5, 0.5, 1.5, 2.5]; // Це значення π/2, 3π/2, 5π/2 тощо
                for (let asymptote of asymptotes) {
                    const x = centerX + asymptote * scaleX * Math.PI;
                    if (x >= 0 && x <= graphCanvas.width) {
                        ctx.strokeStyle = '#ff6b6b';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([5, 5]);
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, graphCanvas.height);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }
            }
            
            // Осі
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 2;
            ctx.setLineDash([]);
            
            // X-вісь
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(graphCanvas.width, centerY);
            ctx.stroke();
            
            // Y-вісь
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, graphCanvas.height);
            ctx.stroke();
            
            // Підписи осей
            ctx.fillStyle = '#ccc';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            
            // Підписи на X-осі
            const labels = [
                {step: -3, label: '-3π'},
                {step: -2, label: '-2π'},
                {step: -1.5, label: '-3π/2'},
                {step: -1, label: '-π'},
                {step: -0.5, label: '-π/2'},
                {step: 0, label: '0'},
                {step: 0.5, label: 'π/2'},
                {step: 1, label: 'π'},
                {step: 1.5, label: '3π/2'},
                {step: 2, label: '2π'},
                {step: 3, label: '3π'}
            ];
            
            for (let {step, label} of labels) {
                const x = centerX + step * scaleX * Math.PI;
                if (x >= 20 && x <= graphCanvas.width - 20) {
                    ctx.fillText(label, x, centerY + 15);
                }
            }
            
            // Підписи на Y-осі
            ctx.textAlign = 'left';
            ctx.fillText('1', centerX + 5, centerY - scaleY / 3 + 4);
            ctx.fillText('-1', centerX + 5, centerY + scaleY / 3 + 4);
            ctx.fillText('2', centerX + 5, centerY - 2 * scaleY / 3 + 4);
            ctx.fillText('-2', centerX + 5, centerY + 2 * scaleY / 3 + 4);
            
            // Малювання графіків
            ctx.lineWidth = 2;
            
            if (activeGraphs.sin) {
                ctx.strokeStyle = '#3498db';
                drawFunction(x => Math.sin(x), scaleX, scaleY, centerY, centerX, 3);
            }
            
            if (activeGraphs.cos) {
                ctx.strokeStyle = '#e74c3c';
                drawFunction(x => Math.cos(x), scaleX, scaleY, centerY, centerX, 3);
            }
            
            if (activeGraphs.tan) {
                ctx.strokeStyle = '#2ecc71';
                drawTangentFunction(scaleX, scaleY, centerY, centerX);
            }
            
            // Поточна точка
            const angleRad = (currentAngle * Math.PI) / 180;
            const x = centerX + angleRad * scaleX;
            
            if (x >= 0 && x <= graphCanvas.width) {
                ctx.fillStyle = '#ffff00';
                
                if (activeGraphs.sin) {
                    const y = centerY - Math.sin(angleRad) * scaleY / 3;
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, 2 * Math.PI);
                    ctx.fill();
                }
                
                if (activeGraphs.cos) {
                    const y = centerY - Math.cos(angleRad) * scaleY / 3;
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, 2 * Math.PI);
                    ctx.fill();
                }
                
                if (activeGraphs.tan && Math.abs(Math.cos(angleRad)) > 0.01) {
                    const tanVal = Math.tan(angleRad);
                    if (Math.abs(tanVal) < 10) {
                        const y = centerY - tanVal * scaleY / 3;
                        if (y >= 0 && y <= graphCanvas.height) {
                            ctx.beginPath();
                            ctx.arc(x, y, 5, 0, 2 * Math.PI);
                            ctx.fill();
                        }
                    }
                }
            }
        }
        
        function drawFunction(func, scaleX, scaleY, centerY, centerX, scale) {
            graphCtx.beginPath();
            let started = false;
            
            for (let pixel = 0; pixel < graphCanvas.width; pixel++) {
                const x = (pixel - centerX) / scaleX;
                const y = centerY - func(x) * scaleY / scale;
                
                if (!started) {
                    graphCtx.moveTo(pixel, y);
                    started = true;
                } else {
                    graphCtx.lineTo(pixel, y);
                }
            }
            
            graphCtx.stroke();
        }
        
        function drawTangentFunction(scaleX, scaleY, centerY, centerX) {
            graphCtx.beginPath();
            let pathStarted = false;
            
            for (let pixel = 0; pixel < graphCanvas.width; pixel++) {
                const x = (pixel - centerX) / scaleX;
                const cosVal = Math.cos(x);
                
                // Перевіряємо, чи не знаходимося біля асимптоти
                const nearAsymptote = Math.abs(cosVal) < 0.01;
                
                if (!nearAsymptote) {
                    const tanVal = Math.tan(x);
                    
                    // Обмежуємо значення для кращого відображення
                    if (Math.abs(tanVal) < 20) {
                        const y = centerY - tanVal * scaleY / 3;
                        
                        if (y >= -100 && y <= graphCanvas.height + 100) {
                            if (!pathStarted) {
                                graphCtx.moveTo(pixel, y);
                                pathStarted = true;
                            } else {
                                graphCtx.lineTo(pixel, y);
                            }
                        }
                    } else {
                        // Якщо значення занадто велике, припиняємо поточний шлях
                        if (pathStarted) {
                            graphCtx.stroke();
                            graphCtx.beginPath();
                            pathStarted = false;
                        }
                    }
                } else {
                    // Біля асимптоти - припиняємо поточний шлях
                    if (pathStarted) {
                        graphCtx.stroke();
                        graphCtx.beginPath();
                        pathStarted = false;
                    }
                }
            }
            
            // Завершуємо останній шлях, якщо він існує
            if (pathStarted) {
                graphCtx.stroke();
            }
        }

        function updateTrigonometry(angleDegrees) {
            currentAngle = angleDegrees;
            const angleRad = (angleDegrees * Math.PI) / 180;
            
            const sinVal = Math.sin(angleRad);
            const cosVal = Math.cos(angleRad);
            const tanVal = Math.tan(angleRad);
            
            // Оновлення значень
            angleDisplay.textContent = `${angleDegrees}°`;
            radianDisplay.textContent = angleRad.toFixed(2);
            sinValue.textContent = sinVal.toFixed(3);
            cosValue.textContent = cosVal.toFixed(3);
            
            // Спеціальна обробка для тангенса
            if (Math.abs(cosVal) < 0.001) {
                tanValue.textContent = '∞';
            } else if (Math.abs(tanVal) > 1000) {
                tanValue.textContent = tanVal > 0 ? '+∞' : '-∞';
            } else {
                tanValue.textContent = tanVal.toFixed(3);
            }
            
            angleSlider.value = angleDegrees;
            
            // Перемалювання
            drawCircle();
            drawGraph();
        }

        function animate() {
            if (isAnimating) {
                currentAngle = (currentAngle + 2) % 720;
                if (currentAngle > 360) currentAngle = currentAngle - 720;
                updateTrigonometry(currentAngle);
                animationId = requestAnimationFrame(animate);
            }
        }

        // Обробники подій
        angleSlider.addEventListener('input', (e) => {
            if (!isAnimating) {
                updateTrigonometry(parseInt(e.target.value));
            }
        });

        animateCheck.addEventListener('change', (e) => {
            isAnimating = e.target.checked;
            if (isAnimating) {
                animate();
            } else {
                cancelAnimationFrame(animationId);
            }
        });

        resetBtn.addEventListener('click', () => {
            isAnimating = false;
            animateCheck.checked = false;
            cancelAnimationFrame(animationId);
            updateTrigonometry(0);
        });

        // Обробники для відображення функцій на колі
        showSin.addEventListener('change', () => {
            drawCircle();
        });

        showCos.addEventListener('change', () => {
            drawCircle();
        });

        showTan.addEventListener('change', () => {
            drawCircle();
        });

        // Обробники для кнопок графіків
        graphSinBtn.addEventListener('click', () => {
            activeGraphs.sin = !activeGraphs.sin;
            graphSinBtn.classList.toggle('active', activeGraphs.sin);
            drawGraph();
        });

        graphCosBtn.addEventListener('click', () => {
            activeGraphs.cos = !activeGraphs.cos;
            graphCosBtn.classList.toggle('active', activeGraphs.cos);
            drawGraph();
        });

        graphTanBtn.addEventListener('click', () => {
            activeGraphs.tan = !activeGraphs.tan;
            graphTanBtn.classList.toggle('active', activeGraphs.tan);
            drawGraph();
        });

        clearGraphBtn.addEventListener('click', () => {
            activeGraphs = { sin: false, cos: false, tan: false };
            graphSinBtn.classList.remove('active');
            graphCosBtn.classList.remove('active');
            graphTanBtn.classList.remove('active');
            drawGraph();
        });

        // Ініціалізація
        updateTrigonometry(0);
    </script>
</body>
</html>
